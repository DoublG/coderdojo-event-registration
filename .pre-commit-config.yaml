# Optional checks before every commit (CONTRIBUTING.md): `pipx install pre-commit`,
# then `pre-commit install` where you run `git commit`. CI checks the same and more,
# so this only saves a failed run. Keep ruff's rev equal to requirements-dev.txt's ruff.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.8
    hooks:
      - id: ruff-check
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: detect-private-key
        exclude: ^\.devcontainer/certs/
      - id: check-added-large-files
        args: ["--maxkb=5120"]
