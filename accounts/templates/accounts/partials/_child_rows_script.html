{% load i18n %}<script>
  // "Add another child" / "Remove" on family sign-up (accounts.forms.ChildRowsFormSet).
  // A new row is the formset's empty_form (the <template>), numbered one past
  // the highest row; removing one leaves a gap in the field names, which the
  // formset allows. Only the "Child n" titles are renumbered.
  (function () {
    var childrenEl = document.getElementById("rp-children");
    var addButton = document.getElementById("rp-add-child");
    var template = document.getElementById("rp-child-template");
    var total = document.querySelector("[name='child-TOTAL_FORMS']");
    if (!childrenEl || !addButton || !template) return;

    var T = {
      child: "{% translate 'Child {n}' as t %}{{ t|escapejs }}",
      remove: "{% translate 'Remove' as t %}{{ t|escapejs }}"
    };

    function rowNumber(row) {
      var name = row.querySelector("[name$='-name']");
      return name ? parseInt(name.name.split("-")[1], 10) : -1;
    }

    function sync() {
      var rows = childrenEl.querySelectorAll("[data-child]");
      rows.forEach(function (row, i) {
        row.querySelector(".cd-form__subgroup-title").textContent = T.child.replace("{n}", i + 1);
        var removeBtn = row.querySelector(".cd-form__remove");
        if (rows.length > 1 && !removeBtn) {
          var btn = document.createElement("button");
          btn.type = "button";
          btn.className = "cd-form__remove body-sm";
          btn.textContent = T.remove;
          btn.addEventListener("click", function () { row.remove(); sync(); });
          row.querySelector(".cd-form__subgroup-header").appendChild(btn);
        } else if (rows.length === 1 && removeBtn) {
          removeBtn.remove();
        }
      });
    }

    addButton.addEventListener("click", function () {
      var numbers = Array.prototype.map.call(childrenEl.querySelectorAll("[data-child]"), rowNumber);
      var n = (numbers.length ? Math.max.apply(null, numbers) : -1) + 1;
      var wrapper = document.createElement("div");
      wrapper.innerHTML = template.innerHTML.replace(/__prefix__/g, n);
      var row = wrapper.querySelector("[data-child]");
      // Brothers and sisters usually share a family name: start from the previous child's.
      var previous = childrenEl.querySelectorAll("[name$='-family_name']");
      if (previous.length) row.querySelector("[name$='-family_name']").value = previous[previous.length - 1].value;
      childrenEl.appendChild(row);
      if (total) total.value = n + 1;
      sync();
    });
    sync();
  })();
</script>
