# Deploys to Level27 on every push to the `demo` branch, and by hand from the Actions tab.
# `demo` is protected (repository ruleset "Protect demo"): a push to it is a merged pull
# request from `main`, with a merge commit.
# It runs the test suite first (tests.yml, called as a reusable workflow) and deploys
# only when that passes, with the same scripts/deploy.sh a developer runs locally
# (scripts/CLAUDE.md, "Deploying"): the new code is checked on the server before the
# live site is touched, then migrated, reloaded, smoke-tested, and the Celery workers
# are restarted.
#
# One-time setup (repository Settings → Environments → "demo"):
#   - secret LEVEL27_SSH_KEY: a private key whose public half is in the Level27
#     account's ~/.ssh/authorized_keys (a key of its own for CI, without a passphrase);
#   - variable LEVEL27_KNOWN_HOSTS: the server's host key, the output of
#     `ssh-keyscan c40a7b15f.l27powered.eu` checked against a known-good connection
#     (public, so a variable, which can be read back; a secret of that name works too);
#   - variable DEPLOY_REMOTE (optional): the ssh target, when it isn't deploy.sh's default.
# The server's ~/app/.env is kept as it is: CI never uploads one.
#
# Versions (scripts/CLAUDE.md, "Versions"): each deploy gets the next CalVer number
# (.github/scripts/release_version.sh, e.g. 2026.10.3), which deploy.sh writes into
# BUILD_INFO for the site to show. Only once the deploy succeeded is the commit tagged
# with it and a GitHub Release made, so a failed deploy uses up no number; a deploy of
# a commit that already has one (run again) keeps it.
name: Deploy to demo

on:
  push:
    branches: [demo]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  deploy:
    needs: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: demo
    # Writing: the version's tag and its GitHub Release, after a successful deploy.
    permissions:
      contents: write
    # One deploy at a time, and never cancel one halfway: a newer push waits its turn.
    concurrency:
      group: deploy-demo
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # the tags: the version comes from them

      - name: Pick the version
        id: version
        run: .github/scripts/release_version.sh

      # Sphinx, so deploy.sh builds the help centre (en/fr/nl) and ships it to ~/docs.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install the help centre's tools
        run: pip install -r docs/requirements.txt

      - name: Set up the SSH key
        env:
          SSH_KEY: ${{ secrets.LEVEL27_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.LEVEL27_KNOWN_HOSTS || secrets.LEVEL27_KNOWN_HOSTS }}
        run: |
          if [ -z "$SSH_KEY" ] || [ -z "$KNOWN_HOSTS" ]; then
            echo "::error::the secret LEVEL27_SSH_KEY and the variable LEVEL27_KNOWN_HOSTS must be set on the 'demo' environment"
            exit 1
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Preflight (read-only)
        env:
          DEPLOY_REMOTE: ${{ vars.DEPLOY_REMOTE }}
          DEPLOY_VERSION: ${{ steps.version.outputs.version }}
        run: |
          [ -n "$DEPLOY_REMOTE" ] || unset DEPLOY_REMOTE
          scripts/deploy.sh --check

      - name: Deploy
        env:
          DEPLOY_REMOTE: ${{ vars.DEPLOY_REMOTE }}
          DEPLOY_VERSION: ${{ steps.version.outputs.version }}
        run: |
          [ -n "$DEPLOY_REMOTE" ] || unset DEPLOY_REMOTE
          scripts/deploy.sh --yes

      # The tag and the release only now: the version is live. The notes list the
      # pull requests and commits since the previous release (GitHub's own).
      - name: Tag and release the version
        if: ${{ steps.version.outputs.new == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          PREVIOUS: ${{ steps.version.outputs.previous }}
        run: |
          gh release create "$VERSION" --target "$GITHUB_SHA" --title "$VERSION" \
            --generate-notes --notes-start-tag "$PREVIOUS"

      - name: Summary
        if: ${{ success() }}
        run: |
          echo "### Deployed ${{ steps.version.outputs.version }} (\`$(git rev-parse --short HEAD)\`) to Level27" >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the SSH key
        if: ${{ always() }}
        run: rm -f ~/.ssh/id_ed25519
