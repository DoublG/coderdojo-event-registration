# Code audit and vulnerability detection: the checks MAINTENANCE.md ("Code audits")
# lists, on every change instead of once a quarter.
#   lint           ruff check + ruff format --check (pyproject.toml)
#   layers         lint-imports: no app imports a layer above its own (pyproject.toml)
#   security-lint  ruff's flake8-bandit rules (S): security-sensitive patterns
#   dependencies   pip-audit: known vulnerabilities in the pinned packages
#   django-deploy  manage.py check --deploy with DEBUG off: production security settings (no warnings)
#   codeql         GitHub's static analysis (security-extended queries) into Code scanning
# Also runs every Monday, since new advisories appear without any change here.
name: Code audit

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      # The ruff version pinned in requirements-dev.txt.
      - run: pip install "$(grep -E '^ruff==' requirements-dev.txt)"
      - run: ruff check --output-format github .
      - run: ruff format --check .

  layers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      # import-linter and its dependencies, as pinned in requirements-dev.txt; it
      # reads the code without importing it, so nothing else is needed.
      - name: Install import-linter
        run: >-
          pip install $(grep -hE '^(import-linter|grimp|rich|markdown-it-py|mdurl|Pygments|click|typing_extensions)=='
          requirements-dev.txt requirements.txt)
      - run: lint-imports

  security-lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install "$(grep -E '^ruff==' requirements-dev.txt)"
      # Tests, seeders and local tooling are left out in pyproject.toml; a reviewed
      # line on the site carries `# noqa: Sxxx` with its reason.
      - run: ruff check --extend-select S --output-format github .

  # mypy with django-stubs' plugin over the modules in pyproject.toml's [tool.mypy]
  # (CODING_STANDARDS.md, "Type checking"). The plugin runs django.setup(), so this
  # needs the site's requirements, its system libraries and its settings.
  types:
    runs-on: ubuntu-24.04
    env:
      DEBUG: "false"
      SILK: "false"
      SECRET_KEY: ci-only-not-a-secret-${{ github.run_id }}-with-enough-length-and-variety-0123456789
      ALLOWED_HOSTS: coolregistration.localhost
      CSRF_TRUSTED_ORIGINS: https://coolregistration.localhost
      COOKIE_DOMAIN: coolregistration.localhost
      EMAIL_HOST: ""
    steps:
      - uses: actions/checkout@v7
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config default-libmysqlclient-dev \
            gdal-bin libgdal-dev libgeos-dev libproj-dev
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Install mypy and django-stubs (the pins in requirements-dev.txt)
        run: >-
          pip install $(grep -hE '^(mypy|django-stubs|django-stubs-ext|mypy_extensions|pathspec|librt|ast_serialize|types-PyYAML)=='
          requirements-dev.txt)
      - run: mypy

  dependencies:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install pip-audit
      # Both files are fully pinned, so pip-audit checks them as written, without
      # installing anything (--no-deps --disable-pip). The django-celery-beat URL pin
      # is skipped (it has no version to look up).
      # An ignored advisory must be in MAINTENANCE.md's security log with its assessment:
      #   CVE-2026-49265 (oauthlib, PKCE): not reachable, the API only offers client credentials.
      - name: pip-audit
        run: >-
          pip-audit --no-deps --disable-pip --progress-spinner off
          -r requirements.txt -r requirements-dev.txt
          --ignore-vuln CVE-2026-49265
          --desc on

  django-deploy:
    runs-on: ubuntu-24.04
    services:
      # MySQL's own model checks ask the server for its version; nothing is migrated.
      db:
        image: mysql:8.4  # the devcontainer's version; a change goes in MAINTENANCE.md too
        env:
          MYSQL_ROOT_PASSWORD: ci-only
          MYSQL_DATABASE: coolregistration
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-only"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      # Production-like: DEBUG off, no silk.
      DEBUG: "false"
      SILK: "false"
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_NAME: coolregistration
      DB_USER: root
      DB_PASSWORD: ci-only
      SECRET_KEY: ci-only-not-a-secret-${{ github.run_id }}-with-enough-length-and-variety-0123456789
      ALLOWED_HOSTS: coolregistration.localhost
      CSRF_TRUSTED_ORIGINS: https://coolregistration.localhost
      COOKIE_DOMAIN: coolregistration.localhost
      EMAIL_HOST: ""
      # What production's .env should hold once the https steps are done (MAINTENANCE.md,
      # security log): the redirect on and a year of HSTS for the domain and its subdomains.
      SECURE_SSL_REDIRECT: "true"
      SECURE_HSTS_SECONDS: "31536000"
      SECURE_HSTS_INCLUDE_SUBDOMAINS: "true"
    steps:
      - uses: actions/checkout@v7
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config default-libmysqlclient-dev \
            gdal-bin libgdal-dev libgeos-dev libproj-dev
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt
      # Only the production set: also proves requirements.txt installs on its own.
      - run: pip install -r requirements.txt
      # Fails on any warning: a new one is a security setting to fix, not to note.
      - name: manage.py check --deploy
        run: |
          set -o pipefail
          python manage.py check --deploy --fail-level WARNING 2>&1 | tee check.txt
          { echo "### manage.py check --deploy"; echo '```'; cat check.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  codeql:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: python, javascript-typescript
          queries: security-extended
          # Third-party browser libraries (htmx, OpenLayers) are vendored as-is.
          config: |
            paths-ignore:
              - "**/vendor/**"
              - "staticfiles/**"
              - "docs/**"
      - uses: github/codeql-action/analyze@v4
