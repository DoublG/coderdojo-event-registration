# Weekly update pull requests, grouped so there are few of them. The Python
# requirements are compiled with hashes (pip-compile, MAINTENANCE.md "Hash-checked
# installs"): Dependabot changes the pin in the .in file and recompiles the .txt. Dependabot's
# security updates (repository settings) come on top, as soon as an advisory is out.
# Each update PR is a change like any other (CONTRIBUTING.md): the tests and the
# code audit run on it, and MAINTENANCE.md's row for the package or image gets
# updated before it's merged. A major version bump comes on its own.
version: 2
updates:
  - package-ecosystem: pip
    directories: ["/", "/docs", "/loadtest", "/.github/requirements"]
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Brussels
    open-pull-requests-limit: 5
    # Held back on purpose: the reason is next to the pin in requirements*.txt.
    ignore:
      # django-two-factor-auth 1.18.1 needs webauthn<2.99, and webauthn 2.x needs cbor2<6.
      - dependency-name: webauthn
        update-types: ["version-update:semver-major"]
      - dependency-name: cbor2
        update-types: ["version-update:semver-major"]
      # radon 6.0.1 needs mando<0.8.
      - dependency-name: mando
        versions: [">=0.8"]
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Brussels
    groups:
      actions:
        patterns: ["*"]

  # The workspace image and the devcontainer's services. The MySQL and Redis
  # services in .github/workflows/*.yml stay on the devcontainer's versions
  # (CLAUDE.md, "Keep MAINTENANCE.md current"): change them in the same PR.
  - package-ecosystem: docker
    directory: "/.devcontainer/dockerfile_workspace"
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Brussels
    ignore:
      # A new Python version is a decision of its own (MAINTENANCE.md), not a weekly update.
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: docker-compose
    directory: "/.devcontainer"
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Brussels
    ignore:
      # MySQL stays on its LTS line (8.4) and Redis on production's version: a new
      # major moves together with Level27's, by hand (MAINTENANCE.md).
      - dependency-name: mysql
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: redis
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      # Prometheus stays on its LTS line (3.13): patch releases only.
      - dependency-name: prom/prometheus
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
