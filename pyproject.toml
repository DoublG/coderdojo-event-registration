[tool.ruff]
line-length = 119
target-version = "py312"
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "B",   # flake8-bugbear
    "DJ",  # flake8-django
    "UP",  # pyupgrade
    "C90", # mccabe: no function over the complexity below (CODING_STANDARDS.md, "Complexity")
]
ignore = [
    "E501",  # line length is enforced by the formatter, not worth erroring twice
]

# Security rules (flake8-bandit, "S") are not in `select`: they run with
# `ruff check --extend-select S .`, in the audit workflow (.github/workflows/audit.yml)
# and the quarterly checks in MAINTENANCE.md. Code that never runs on the site
# is left out; a reviewed line on the site has `# noqa: Sxxx` with its reason.
[tool.ruff.lint.per-file-ignores]
"**/tests.py" = ["S"]
"**/tests/**" = ["S"]
"**/testing.py" = ["S"]
# Seed code (demo data) may stay long: random choices, known passwords, and
# scripts too complex to keep under 20 until they next need work.
"**/management/commands/seed_*.py" = ["S", "C901"]
"applications/seeding.py" = ["S"]
"accounts/seed_credentials.py" = ["S", "C901"]
"user-journeys/**" = ["S"]                   # developers' screenshot tooling
"loadtest/**" = ["S"]                        # developers' load test: random visitors, a known test password

# Over 20 is rank D: split it (CODING_STANDARDS.md, "Complexity and maintainability").
[tool.ruff.lint.mccabe]
max-complexity = 20

[tool.ruff.lint.isort]
known-first-party = [
    "accounts", "api", "applications", "campaigns", "content", "core", "dojos", "events", "geo",
    "mailing", "monitoring", "notifications", "pages", "pathways", "privacy", "website",
]

# The layers between the apps (CODING_STANDARDS.md, "Layers"): `lint-imports`
# (import-linter, requirements-dev.txt), also in the Code audit workflow. An app
# may import its own layer and the layers below it, never one above. Within a
# layer the apps may use each other (`:`), which is what dojos and events, or
# the mail engine and the apps it mails for, need. What the site's code runs
# must keep to it; tests, test helpers and management commands (entry points
# run from outside, like the top layer) may reach anywhere.
[tool.importlinter]
root_packages = [
    "accounts", "api", "applications", "campaigns", "content", "core", "dojos", "events",
    "geo", "mailing", "monitoring", "notifications", "pages", "pathways", "privacy",
]
include_external_packages = false

[[tool.importlinter.contracts]]
name = "Layers"
type = "layers"
layers = [
    # The site as visitors and the organisation meet it, assembled from the rest.
    "pages",
    # What reads across the domain: campaigns and segments, the API, the GDPR
    # operations (export, erasure, retention).
    "api : campaigns : privacy",
    # The domain, with the mail engine and the notifications it sends through.
    "accounts : applications : content : dojos : events : mailing : notifications : pathways",
    # The foundation: knows no app. Apps register with it from their
    # AppConfig.ready() (image library, /metrics/ sources, the privacy registry).
    "core : geo : monitoring",
]
ignore_imports = [
    "**.tests -> **",
    "**.testing -> **",
    "**.management.commands.** -> **",
]

[tool.ruff.format]
quote-style = "double"

# Test coverage (CODING_STANDARDS.md, "Test coverage"): coverage.py over the whole
# suite, branches included. `coverage run manage.py test ...`, then `coverage report`.
[tool.coverage.run]
branch = true
concurrency = ["thread"]
source = ["."]
omit = [
    "*/migrations/*",
    "*/tests.py",
    "*/tests/*",
    "manage.py",
    "main.py",
    "docs/*",
    "loadtest/*",
    "user-journeys/*",
    ".github/*",
    ".devcontainer/*",
    "staticfiles/*",
    "media/*",
]

[tool.coverage.report]
skip_empty = true
exclude_also = [
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]

# Type checking (CODING_STANDARDS.md, "Type checking"): mypy with django-stubs' plugin,
# gradually. Only the modules in `files` are checked, and they're fully annotated
# (disallow_untyped_defs); whatever they import is read for its types but its own
# errors aren't reported (follow_imports = "silent"). Add a module here once it's
# annotated: the service modules first. `mypy` (no arguments) runs it, also in the
# Code audit workflow.
[tool.mypy]
python_version = "3.14"
plugins = ["mypy_django_plugin.main"]
files = [
    "dojos/team.py",
    "mailing/queue_actions.py",
    "privacy/retention.py",
]
follow_imports = "silent"
# Libraries without type information (two-factor, auditlog, oauth toolkit, ...).
ignore_missing_imports = true
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
# Not warn_return_any yet: checked modules call unannotated ones, whose results are Any;
# switch it on once most of what they call is annotated too.

[tool.django-stubs]
django_settings_module = "website.settings"
