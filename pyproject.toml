[tool.ruff]
line-length = 119
target-version = "py312"
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort
    "B",   # flake8-bugbear
    "DJ",  # flake8-django
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line length is enforced by the formatter, not worth erroring twice
]

# Security rules (flake8-bandit, "S") are not in `select`: they run with
# `ruff check --extend-select S .`, in the audit workflow (.github/workflows/audit.yml)
# and the quarterly checks in MAINTENANCE.md. Code that never runs on the site
# is left out; a reviewed line on the site has `# noqa: Sxxx` with its reason.
[tool.ruff.lint.per-file-ignores]
"**/tests.py" = ["S"]
"**/tests/**" = ["S"]
"**/testing.py" = ["S"]
"**/management/commands/seed_*.py" = ["S"]   # demo data: random choices, known passwords
"applications/seeding.py" = ["S"]
"accounts/seed_credentials.py" = ["S"]
"user-journeys/**" = ["S"]                   # developers' screenshot tooling
"loadtest/**" = ["S"]                        # developers' load test: random visitors, a known test password

[tool.ruff.lint.isort]
known-first-party = [
    "accounts", "applications", "content", "core", "dojos",
    "events", "geo", "notifications", "pathways", "privacy", "website",
]

[tool.ruff.format]
quote-style = "double"
