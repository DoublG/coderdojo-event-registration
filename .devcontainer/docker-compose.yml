services:
  workspace:
    container_name: ${PROJECT_NAME:-coolregistration-dev}-workspace
    build:
      context: ..
      dockerfile: .devcontainer/dockerfile_workspace/Dockerfile

    environment:
      # Trust the system CA store (installed by .devcontainer/start.sh from
      # .devcontainer/certs/pki/ca.crt) so server-side HTTPS calls to
      # coolregistration.localhost verify like a browser that trusted the same CA.
      NODE_OPTIONS: "--use-system-ca"

      # Commits made inside this container (by Claude Code) are Claude's,
      # whatever the repo's own git config says (CLAUDE.md, "Workflow rules").
      # Set any of these in the environment that runs `docker compose` (or in
      # .devcontainer/.env) to commit under another identity instead.
      GIT_AUTHOR_NAME: ${GIT_AUTHOR_NAME:-Claude}
      GIT_AUTHOR_EMAIL: ${GIT_AUTHOR_EMAIL:-noreply@anthropic.com}
      GIT_COMMITTER_NAME: ${GIT_COMMITTER_NAME:-Claude}
      GIT_COMMITTER_EMAIL: ${GIT_COMMITTER_EMAIL:-noreply@anthropic.com}

      # Database configuration - read by website/settings.py
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: coolregistration
      DB_USER: coolregistration
      DB_PASSWORD: Se84KCCCJlnfkdfv

      SECRET_KEY: c8%og)f*3&xi&6l_s#ol%ctm7t9%ti&lko6x@^b&t8ow0d3-7m
      ALLOWED_HOSTS: localhost,127.0.0.1,coolregistration.localhost

      COOKIE_DOMAIN: coolregistration.localhost
      CSRF_TRUSTED_ORIGINS: https://coolregistration.localhost

      # Redis (cache) - read by website/settings.py
      REDIS_HOST: redis
      REDIS_PORT: 6379

      # On by default. `DEBUG=false` in the environment that runs docker compose
      # (or in .devcontainer/.env) runs the site like production to check its
      # speed: start.sh then collects the static files for nginx and serves the
      # site with gunicorn instead of runserver (CLAUDE.md, "Commands").
      DEBUG: ${DEBUG:-true}
      # django-silk profiling (settings.SILK_ENABLED): follows DEBUG unless set;
      # `SILK=true` with `DEBUG=false` profiles the production-like run.
      SILK: ${SILK:-${DEBUG:-true}}
      STATIC_ROOT: /workspace/staticfiles

      # Test mailcient
      EMAIL_HOST: mailpit
      EMAIL_PORT: 1025
      EMAIL_HOST_USER: ""
      EMAIL_HOST_PASSWORD: ""
      EMAIL_USE_TLS: "false"
      EMAIL_USE_SSL: "false"
      DEFAULT_FROM_EMAIL: "CoderDojo Belgium <noreply@coolregistration.localhost>"

      # Bounces (mailing.bounce): mail goes out with this envelope sender, and
      # process_bounces reads Mailpit itself as the bounce mailbox, over POP3
      # (Mailpit has no IMAP; production reads its real mailbox over IMAP).
      # `manage.py simulate_bounce` sends a bounce report into Mailpit.
      MAILING_BOUNCE_ADDRESS: "bounces@coolregistration.localhost"
      MAILING_BOUNCE_PROTOCOL: pop3
      MAILING_BOUNCE_IMAP_HOST: mailpit
      MAILING_BOUNCE_IMAP_PORT: 1110
      MAILING_BOUNCE_IMAP_SSL: "false"
      MAILING_BOUNCE_IMAP_USER: bounces
      MAILING_BOUNCE_IMAP_PASSWORD: bounces

      # Claude Code keeps its login, settings, memory and session history
      # under this dir. Setting it explicitly also moves its global config
      # file (normally ~/.claude.json, outside ~/.claude) into the same dir,
      # so everything lands on the claude-config volume below and survives
      # a container rebuild.
      CLAUDE_CONFIG_DIR: /root/.claude

      # The testers' authenticator (the `otp` service, 2FAuth): `manage.py
      # seed_otp_vault` (end of start.sh) puts every seeded account's
      # authenticator-app key in it. Unset (production) = the command does nothing.
      OTP_VAULT_URL: http://otp:8000

    volumes:
      - ..:/workspace:cached
      # Persist Claude Code auth/sessions across rebuilds (see CLAUDE_CONFIG_DIR).
      - claude-config:/root/.claude

    working_dir: /workspace

    command: sleep infinity

    # No ports: the only way in from the host is nginx on 443 (the `proxy`
    # service), which reaches every container by its service name.

    depends_on:
      - db
      - redis

  # Pinned versions, never `latest` (a `latest` image is pulled once and then
  # silently ages): the versions production runs or will run next, see
  # MAINTENANCE.md, "Development". MySQL 8.4 is the LTS (security fixes to April 2032).
  # Changing any image version in this file? Update its row in that table in the
  # same change (and the CI's MySQL/Redis services in .github/workflows/).
  db:
    image: mysql:8.4
    container_name: ${PROJECT_NAME:-coolregistration-dev}-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: coolregistration
      MYSQL_DATABASE: coolregistration
      MYSQL_USER: coolregistration
      MYSQL_PASSWORD: Se84KCCCJlnfkdfv
    volumes:
      # Named after the MySQL version: a MySQL can't open the data of a newer one
      # (this used to be 9.1 on `db-data`), so a version change starts a new volume,
      # which start.sh seeds. To keep your data instead, dump it first (MAINTENANCE.md).
      - db-data-8.4:/var/lib/mysql
      # Runs once against a fresh volume — grants the app user rights on
      # Django's test database too (see db-init/01-grant-test-db.sql).
      - ./db-init:/docker-entrypoint-initdb.d:ro

  redis:
    image: redis:7.2
    container_name: ${PROJECT_NAME:-coolregistration-dev}-redis
    restart: unless-stopped

  # The only container with a port on the host: https://coolregistration.localhost
  # (443). Everything else is a path behind it (nginx/nginx.conf): the site,
  # /docs/, /mails/ (Mailpit), /phpmyadmin/ and /otp/ (the testers' authenticator).
  proxy:
    image: nginx:1.30-alpine
    container_name: ${PROJECT_NAME:-coolregistration-dev}-proxy
    restart: unless-stopped
    depends_on:
      - workspace
      - mailpit
      - phpmyadmin
      - otp
    ports:
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
      # Sphinx end-user docs (docs/build/html) - rebuild with `make html`
      # (from inside docs/) after changing anything under docs/source/.
      - ../docs/build/html:/usr/share/nginx/html/docs:ro
      # /static/ (collectstatic's output, only filled when DEBUG is off) and
      # the public /media/ files, served by nginx itself (nginx.conf).
      # Never private_media/.
      - ../staticfiles:/srv/static:ro
      - ../media:/srv/media:ro

  phpmyadmin:
    container_name: ${PROJECT_NAME:-coolregistration-dev}-phpmyadmin
    image: phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: db
      # Served under https://coolregistration.localhost/phpmyadmin/ (nginx.conf).
      PMA_ABSOLUTE_URI: https://coolregistration.localhost/phpmyadmin/
      # Logs straight in as the app's own database user (auth_type = config),
      # no login screen: development data only, reachable only through the
      # local proxy. Same credentials as DB_USER/DB_PASSWORD on the workspace.
      PMA_USER: coolregistration
      PMA_PASSWORD: Se84KCCCJlnfkdfv

  mailpit:
    image: axllent/mailpit:latest
    container_name: ${PROJECT_NAME:-coolregistration-dev}-mailpit
    restart: unless-stopped
    volumes:
      - mailpit-data:/data
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: 5000
      MP_WEBROOT: /mails
      # Lets you make Mailpit refuse mail (API: PUT /mails/api/v1/chaos), to
      # watch the mail queue's retries and failures end to end.
      MP_ENABLE_CHAOS: "true"
      # POP3 on 1110 so process_bounces can read Mailpit as the bounce
      # mailbox in dev (matches MAILING_BOUNCE_IMAP_USER/PASSWORD above).
      MP_POP3_AUTH: "bounces:bounces"

  # The testers' authenticator app: 2FAuth (https://github.com/Bubka/2FAuth) at
  # https://coolregistration.localhost/otp/, showing the current code of every
  # seeded account with two-step login. Filled from the demo data by
  # `manage.py seed_otp_vault` (start.sh; run it again after changing someone's
  # app). No login: nginx signs everyone in as one shared user through the
  # Remote-User header (reverse-proxy guard), which the seeder sends too.
  # Development only: it shows login codes to anyone who can reach it.
  otp:
    image: 2fauth/2fauth:latest
    container_name: ${PROJECT_NAME:-coolregistration-dev}-otp
    restart: unless-stopped
    volumes:
      - otp-data:/2fauth
    environment:
      APP_NAME: CoderDojo test authenticator
      # A fixed dev-only key: it has to stay the same across restarts.
      APP_KEY: base64:3oZ7uYxkE0m1S2lqf6rVJ0p0bW4nY1tq8Hc9aR2dKxI=
      APP_URL: https://coolregistration.localhost/otp
      APP_SUBDIRECTORY: otp
      AUTHENTICATION_GUARD: reverse-proxy-guard
      AUTH_PROXY_HEADER_FOR_USER: HTTP_REMOTE_USER
      TRUSTED_PROXIES: "*"
      THROTTLE_API: 1000


volumes:
  db-data-8.4:
  claude-config:
  mailpit-data:
  otp-data:
