services:
  workspace:
    container_name: ${PROJECT_NAME:-coolregistration-dev}-workspace
    build:
      context: ..
      dockerfile: .devcontainer/dockerfile_workspace/Dockerfile

    environment:
      # Trust the system CA store (installed by .devcontainer/start.sh from
      # .devcontainer/certs/pki/ca.crt) so server-side HTTPS calls to
      # coolregistration.localhost verify like a browser that trusted the same CA.
      NODE_OPTIONS: "--use-system-ca"

      # Database configuration - read by website/settings.py
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: coolregistration
      DB_USER: coolregistration
      DB_PASSWORD: Se84KCCCJlnfkdfv

      SECRET_KEY: c8%og)f*3&xi&6l_s#ol%ctm7t9%ti&lko6x@^b&t8ow0d3-7m
      ALLOWED_HOSTS: localhost,127.0.0.1,coolregistration.localhost

      COOKIE_DOMAIN: coolregistration.localhost
      CSRF_TRUSTED_ORIGINS: https://coolregistration.localhost

      # Redis (cache) - read by website/settings.py
      REDIS_HOST: redis
      REDIS_PORT: 6379

      DEBUG: true

      # Test mailcient
      EMAIL_HOST: mailpit
      EMAIL_PORT: 1025
      EMAIL_HOST_USER: ""
      EMAIL_HOST_PASSWORD: ""
      EMAIL_USE_TLS: "false"
      EMAIL_USE_SSL: "false"
      DEFAULT_FROM_EMAIL: "CoderDojo Belgium <noreply@coolregistration.localhost>"

      # Claude Code keeps its login, settings, memory and session history
      # under this dir. Setting it explicitly also moves its global config
      # file (normally ~/.claude.json, outside ~/.claude) into the same dir,
      # so everything lands on the claude-config volume below and survives
      # a container rebuild.
      CLAUDE_CONFIG_DIR: /root/.claude

    volumes:
      - ..:/workspace:cached
      # Persist Claude Code auth/sessions across rebuilds (see CLAUDE_CONFIG_DIR).
      - claude-config:/root/.claude

    working_dir: /workspace

    command: sleep infinity

    ports:
      - "8000:8000"
      - "3000:3000"
      - "3001:3001"
      - "3002:3002"
      - "3004:3004"
      - "3005:3005"

    depends_on:
      - db
      - redis

  db:
    image: mysql:latest
    container_name: ${PROJECT_NAME:-coolregistration-dev}-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: coolregistration
      MYSQL_DATABASE: coolregistration
      MYSQL_USER: coolregistration
      MYSQL_PASSWORD: Se84KCCCJlnfkdfv
    volumes:
      - db-data:/var/lib/mysql
      # Runs once against a fresh volume — grants the app user rights on
      # Django's test database too (see db-init/01-grant-test-db.sql).
      - ./db-init:/docker-entrypoint-initdb.d:ro

  redis:
    image: redis:latest
    container_name: ${PROJECT_NAME:-coolregistration-dev}-redis
    restart: unless-stopped

  proxy:
    image: nginx:1.27-alpine
    container_name: ${PROJECT_NAME:-coolregistration-dev}-proxy
    restart: unless-stopped
    depends_on:
      - workspace
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
      # Sphinx end-user docs (docs/build/html) - rebuild with `make html`
      # (from inside docs/) after changing anything under docs/source/.
      - ../docs/build/html:/usr/share/nginx/html/docs:ro

  phpmyadmin:
    container_name: ${PROJECT_NAME:-coolregistration-dev}-phpmyadmin
    image: phpmyadmin
    restart: unless-stopped
    ports:
      - "3006:80"
    environment:
      PMA_HOST: db

  mailpit:
    image: axllent/mailpit:latest
    container_name: ${PROJECT_NAME:-coolregistration-dev}-mailpit
    restart: unless-stopped
    volumes:
      - mailpit-data:/data
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: 5000
      MP_WEBROOT: /mails

    ports:
      - "1025:1025"
      - "8025:8025"             
    
volumes:
  db-data:
  claude-config:
  mailpit-data:
