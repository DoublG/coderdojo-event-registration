events {}

http {
    # Without this, nginx serves every static file (the /docs/ alias below)
    # as the bare default_type, text/plain — browsers then correctly refuse
    # to apply a stylesheet/script served with the wrong MIME type, so the
    # docs render as unstyled raw HTML even though every request is a 200.
    # Django-proxied responses aren't affected by this (Django sets its own
    # Content-Type), which is why this went unnoticed until /docs/ existed.
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Compress text responses: static files and Django's pages alike (nginx
    # compresses what it proxies too). HTML is always included; the rest are
    # listed. Small responses aren't worth it, and Vary: Accept-Encoding keeps
    # a cache from serving the compressed copy to a client that can't read it.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/css text/javascript application/javascript application/json
               application/xml image/svg+xml text/plain;

    upstream django {
        server workspace:8000;
    }

    server {
        listen 80;
        server_name coolregistration.localhost;

        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name coolregistration.localhost;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/server.key;

        ssl_protocols TLSv1.2 TLSv1.3;

        # Headers for everything proxied below (Django and Mailpit). A location
        # that sets its own proxy_set_header would drop all of these.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;

        # Required for the notification bell's WebSocket connection
        # (notifications/routing.py, ws://.../ws/dojos/<id>/notifications/)
        # to pass through this proxy at all — without the Upgrade/Connection
        # headers, nginx just proxies it as a plain HTTP request and the
        # handshake fails. $http_upgrade is empty on an ordinary request,
        # so this is a no-op for everything else proxied through here.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # End-user docs (Sphinx, see /docs/ at the repo root) — static
        # files only, rebuild locally with `make html` (from inside docs/)
        # to pick up changes; nginx doesn't rebuild them.
        #
        # /docs (no trailing slash) doesn't match the prefix location below
        # on its own, so without this it falls through to the Django proxy
        # and you get Django's 404 page instead of the docs — every
        # asset/page link Sphinx generates is relative to the current
        # directory, so this matters for more than just the entry URL.
        location = /docs {
            return 301 /docs/;
        }

        location /docs/ {
            alias /usr/share/nginx/html/docs/;
            index index.html;
        }

        location = /mails {
            return 301 /mails/;
        }

        location /mails/ {
            proxy_pass http://mailpit:8025/mails/;
        }

        # Static files: from collectstatic's output (/srv/static) when it has
        # the file, which is only when DEBUG is off (start.sh collects them
        # then, and empties the folder when DEBUG is on); otherwise Django's
        # runserver serves them fresh from the apps' own static/ folders.
        location /static/ {
            root /srv;
            try_files $uri @django;
            expires 7d;
        }

        # Public uploads and library images (MEDIA_ROOT). Django only serves
        # these with DEBUG on; nginx does it either way.
        location /media/ {
            root /srv;
        }

        location / {
            proxy_pass http://workspace:8000;
        }

        location @django {
            proxy_pass http://workspace:8000;
        }
    }
}

