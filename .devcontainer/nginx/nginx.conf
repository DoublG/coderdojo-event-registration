events {}

http {
    # Without this, nginx serves every static file (the /docs/ alias below)
    # as the bare default_type, text/plain — browsers then correctly refuse
    # to apply a stylesheet/script served with the wrong MIME type, so the
    # docs render as unstyled raw HTML even though every request is a 200.
    # Django-proxied responses aren't affected by this (Django sets its own
    # Content-Type), which is why this went unnoticed until /docs/ existed.
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Compress text responses: static files and Django's pages alike (nginx
    # compresses what it proxies too). HTML is always included; the rest are
    # listed. Small responses aren't worth it, and Vary: Accept-Encoding keeps
    # a cache from serving the compressed copy to a client that can't read it.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/css text/javascript application/javascript application/json
               application/xml image/svg+xml text/plain;

    # Look the containers up when a request comes in, through Docker's own
    # DNS, not once at startup: a hostname in proxy_pass (or an upstream
    # block) is resolved when nginx starts, and nginx refuses to start at all
    # ("host not found in upstream") when one of them isn't there yet, e.g.
    # the workspace still building on a fresh machine or 2FAuth crashing. It
    # would also keep an old address after a container is recreated (a new
    # IP, so 502s until nginx restarts). A proxy_pass with a variable is
    # resolved per request through this resolver instead; a missing
    # container is then only a 502 on its own paths. `valid` keeps the answer
    # 10 seconds.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # Only 443: docker-compose.yml publishes no other port, so there's no
    # plain-HTTP server to redirect from. Every other container is a path below.
    server {
        listen 443 ssl;
        server_name coolregistration.localhost;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/server.key;

        ssl_protocols TLSv1.2 TLSv1.3;

        # Headers for everything proxied below (Django and Mailpit). A location
        # that sets its own proxy_set_header would drop all of these.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;

        # Required for the notification bell's WebSocket connection
        # (notifications/routing.py, ws://.../ws/dojos/<id>/notifications/)
        # to pass through this proxy at all — without the Upgrade/Connection
        # headers, nginx just proxies it as a plain HTTP request and the
        # handshake fails. $http_upgrade is empty on an ordinary request,
        # so this is a no-op for everything else proxied through here.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # The containers behind this proxy, looked up per request (the
        # resolver above). A proxy_pass with a variable passes the request's
        # URI on unchanged, so a location that serves a container from its
        # root strips its own prefix with a rewrite first.
        set $django     workspace:8000;
        set $mailpit    mailpit:8025;
        set $phpmyadmin phpmyadmin:80;
        set $otp        otp:8000;

        # End-user docs (Sphinx, see /docs/ at the repo root) — static
        # files only, rebuild locally with `make html` (from inside docs/)
        # to pick up changes; nginx doesn't rebuild them.
        #
        # /docs (no trailing slash) doesn't match the prefix location below
        # on its own, so without this it falls through to the Django proxy
        # and you get Django's 404 page instead of the docs — every
        # asset/page link Sphinx generates is relative to the current
        # directory, so this matters for more than just the entry URL.
        location = /docs {
            return 301 /docs/;
        }

        location /docs/ {
            alias /usr/share/nginx/html/docs/;
            index index.html;
        }

        location = /mails {
            return 301 /mails/;
        }

        location /mails/ {
            # Mailpit serves under /mails itself (MP_WEBROOT), so no rewrite.
            proxy_pass http://$mailpit;
        }

        # phpMyAdmin (PMA_ABSOLUTE_URI in docker-compose.yml matches this path).
        location = /phpmyadmin {
            return 301 /phpmyadmin/;
        }

        location /phpmyadmin/ {
            rewrite ^/phpmyadmin(/.*)$ $1 break;
            proxy_pass http://$phpmyadmin;
            client_max_body_size 256m;
        }

        # The testers' authenticator (2FAuth, the `otp` service): its own server
        # serves from /, so the prefix is stripped here (APP_SUBDIRECTORY=otp
        # makes its links carry it). Everyone is signed in as one shared user
        # through Remote-User (reverse-proxy guard), the user seed_otp_vault
        # fills. Setting a header here drops the server-level ones, hence the
        # repeats.
        location = /otp {
            return 301 /otp/;
        }

        location /otp/ {
            rewrite ^/otp(/.*)$ $1 break;
            proxy_pass http://$otp;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Prefix /otp;
            proxy_set_header Remote-User testers;
        }

        # Static files: from collectstatic's output (/srv/static) when it has
        # the file, which is only when DEBUG is off (start.sh collects them
        # then, and empties the folder when DEBUG is on); otherwise Django's
        # runserver serves them fresh from the apps' own static/ folders.
        location /static/ {
            root /srv;
            try_files $uri @django;
            expires 7d;
        }

        # Public uploads and library images (MEDIA_ROOT). Django only serves
        # these with DEBUG on; nginx does it either way.
        location /media/ {
            root /srv;
        }

        location / {
            proxy_pass http://$django;
        }

        location @django {
            proxy_pass http://$django;
        }
    }
}

