# The devcontainer's Prometheus (docker-compose.yml, `monitoring` profile).
# Its route prefix is /prometheus (--web.external-url), also inside the stack.
apiVersion: 1
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090/prometheus
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 15s
